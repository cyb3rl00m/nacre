<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bc4b4"/>
      <stop offset="0.55" stop-color="#2a74d6"/>
      <stop offset="1" stop-color="#5b3fc4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b8f86"/>
      <stop offset="1" stop-color="#3a2a8c"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f3eefc"/>
      <stop offset="0.8" stop-color="#d9cdf2"/>
      <stop offset="1" stop-color="#b9b0e0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6ec" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#ffd6ec" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bdf3ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="120" rx="34" ry="5" fill="#000" opacity="0.18"/>
  <!-- shield -->
  <path d="M64 8 C80 15 96 18 110 18 V58 C110 90 90 108 64 118 C38 108 18 90 18 58 V18 C32 18 48 15 64 8 Z"
        fill="url(#rim)"/>
  <path d="M64 15 C78 21 92 24 104 24 V58 C104 85 87 101 64 110 C41 101 24 85 24 58 V24 C36 24 50 21 64 15 Z"
        fill="url(#shell)"/>
  <!-- shell ridges -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M64 20 V104"/>
    <path d="M64 104 L36 34"/>
    <path d="M64 104 L92 34"/>
  </g>
  <path d="M64 15 C78 21 92 24 104 24 V44 C80 40 50 46 24 60 V24 C36 24 50 21 64 15 Z" fill="url(#gloss)"/>
  <!-- pearl -->
  <circle cx="64" cy="64" r="25" fill="#1d2a6b" opacity="0.25"/>
  <circle cx="64" cy="62" r="24" fill="url(#pearl)"/>
  <circle cx="64" cy="62" r="24" fill="url(#sheen)"/>
  <ellipse cx="55" cy="52" rx="8" ry="5.5" fill="#ffffff" opacity="0.9" transform="rotate(-30 55 52)"/>
</svg>
